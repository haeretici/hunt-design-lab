<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div id="holder"></div>
<pre id="out"></pre>
<script src="https://cdn.jsdelivr.net/npm/@json-editor/json-editor@2.15.1/dist/jsoneditor.min.js"></script>
<script>
async function main() {
  const out = document.getElementById('out');
  try {
    const schema = await (await fetch('http://127.0.0.1:8099/schemas/hunts.schema.json')).json();
    const hunt = await (await fetch('http://127.0.0.1:8099/presets/standard/hunts/cave_crawl_generated.json')).json();
    
    // Minimal wave_regions editor like the real one
    const JE = JSONEditor;
    const Abstract = JE.AbstractEditor;
    class WaveRegionsEditor extends Abstract {
      build() {
        this.header = this.label = this.theme.getFormInputLabel(this.getTitle());
        this.container.appendChild(this.header);
        this.root = document.createElement('div');
        this.root.textContent = 'regions editor';
        this.container.appendChild(this.root);
        this.regions = [];
        this.input = this.root;
      }
      setValue(value) {
        this.regions = Array.isArray(value) ? value : [];
        this.onChange(false);
      }
      getValue() {
        return this.regions;
      }
    }
    JE.defaults.editors.wave_regions = WaveRegionsEditor;
    JE.defaults.resolvers.unshift((schema) => {
      if (schema && schema.format === 'wave_regions') return 'wave_regions';
    });

    const ed = new JSONEditor(document.getElementById('holder'), {
      schema,
      startval: hunt,
      theme: 'bootstrap5',
      iconlib: 'fontawesome5',
      disable_edit_json: true,
      disable_properties: false,
      no_additional_properties: false,
      required_by_default: false,
      keep_oneof_values: false,
      show_errors: 'interaction'
    });
    ed.on('ready', () => {
      const v = ed.getValue();
      out.textContent = JSON.stringify({
        startId: hunt.id,
        startLabel: hunt.label,
        startNotes: !!hunt.notes,
        gotId: v.id,
        gotLabel: v.label,
        gotNotes: v.notes,
        keys: Object.keys(v)
      }, null, 2);
    });
  } catch (e) {
    out.textContent = 'ERR ' + e.stack;
  }
}
main();
</script>
</body>
</html>
