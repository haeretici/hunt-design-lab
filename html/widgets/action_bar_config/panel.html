    <ul class="nav nav-pills gap-2 border-bottom border-secondary pb-3" id="hotkeysMainTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active px-3 py-2 text-uppercase font-monospace small fw-bold" id="tab-action-bars-btn" data-maintab="action_bars" type="button" role="tab">

            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link px-3 py-2 text-uppercase font-monospace small fw-bold" id="tab-general-hotkeys-btn" data-maintab="general" type="button" role="tab">

<!-- Main Tabs Content -->
<div class="tab-content" id="hotkeysMainTabContent">
    <!-- Tab 1: Action Bars Hotkeys -->
    <div class="tab-pane active show" id="actionBarsTabPane" role="tabpanel">
<div class="row g-3">
    <!-- Left Column: Dock Layout Editor -->
    <div class="col-lg-7">
        <div class="card bg-dark border-secondary h-100">
            <div class="card-header bg-black border-secondary d-flex justify-content-between align-items-center p-2">
                <span class="font-monospace small text-uppercase fw-bold text-light"><i class="fa-solid fa-gamepad text-info me-1"></i> Dock Slots & Bindings</span>
                <ul class="nav nav-pills nav-pills-sm card-header-pills" id="dockTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active py-1 px-2 small" id="top-tab" data-dock="top" type="button" role="tab" aria-selected="true">Top</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link py-1 px-2 small" id="bottom-tab" data-dock="bottom" type="button" role="tab" aria-selected="false">Bottom</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link py-1 px-2 small" id="left-tab" data-dock="left" type="button" role="tab" aria-selected="false">Left</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link py-1 px-2 small" id="right-tab" data-dock="right" type="button" role="tab" aria-selected="false">Right</button>
                    </li>
                </ul>
            </div>
            <div class="card-body p-2" style="max-height: 520px; overflow-y: auto;">
                <p class="text-muted text-xs mb-2">Select a slot below to edit targeting and hotkeys, or drag & drop spells and items directly from the catalogs.</p>
                <div id="slotsGrid" class="d-flex flex-column gap-1">
                    <!-- Dynamic slots injected by popup.js -->
                </div>
            </div>
        </div>
    </div>

    <!-- Right Column: Inspector & Catalogs -->
    <div class="col-lg-5">
        <div class="d-flex flex-column gap-3">
            <!-- Slot Inspector -->
            <div class="card bg-dark border-secondary">
                <div class="card-header bg-black border-secondary p-2 d-flex justify-content-between align-items-center">
                    <span class="font-monospace small text-uppercase fw-bold text-light"><i class="fa-solid fa-sliders text-warning me-1"></i> Slot Inspector</span>
                    <span id="inspectorSlotId" class="badge bg-secondary text-xs">No Slot Selected</span>
                </div>
                <div id="inspectorBody" class="card-body p-3 text-muted text-center small">
                    Click a slot in the layout to edit its assignment and bind keys.
                </div>
            </div>

            <!-- Catalogs (Spells & Items) -->
            <div class="card bg-dark border-secondary">
                <div class="card-header bg-black border-secondary p-2 d-flex justify-content-between align-items-center">
                    <ul class="nav nav-tabs card-header-tabs m-0 border-0" id="catalogTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active py-1 px-2 small bg-transparent text-info border-0 border-bottom" id="spell-tab" data-catalog="spells" type="button" role="tab">Spells</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link py-1 px-2 small bg-transparent text-muted border-0" id="item-tab" data-catalog="items" type="button" role="tab">Items & Runes</button>
                        </li>
                    </ul>
                </div>
                <div class="card-body p-2">
                    <!-- Spells Toolbar -->
                    <div id="spellsToolbar" class="mb-2">
                        <input type="text" id="spellSearchInput" class="form-control form-control-sm mb-2 bg-black border-secondary text-white" placeholder="Search spells by name or id...">
                        <div class="form-check form-check-inline mb-0">
                            <input class="form-check-input" type="checkbox" id="showAllSpellsToggle" style="cursor: pointer;">
                            <label class="form-check-label text-xs text-light" for="showAllSpellsToggle">Show all spells available to vocation</label>
                        </div>
                    </div>

                    <!-- Items Toolbar -->
                    <div id="itemsToolbar" class="mb-2" style="display: none;">
                        <input type="text" id="itemSearchInput" class="form-control form-control-sm mb-2 bg-black border-secondary text-white" placeholder="Search items, runes, potions...">
                        <select id="itemCategoryFilter" class="form-select form-select-sm bg-black text-white border-secondary">
                            <option value="all">All Items & Consumables</option>
                            <option value="rune">Runes</option>
                            <option value="potion">Potions & Consumables</option>
                            <option value="equipment">Equipment & Weapons</option>
                        </select>
                    </div>

                    <div id="catalogList" class="p-1" style="max-height: 280px; overflow-y: auto;">
                        <div class="text-center text-muted text-xs p-3">Loading catalog data from engine...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
    </div>

    <!-- Tab 2: General Hotkeys -->
    <div class="tab-pane" id="generalHotkeysTabPane" role="tabpanel" style="display: none;">
        <div id="generalHotkeysAlertHost"></div>
        <div id="generalHotkeysHost">
            <div class="p-5 text-center text-muted small">Loading General Hotkeys...</div>
        </div>
    </div>
</div>
