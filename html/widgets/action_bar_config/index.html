<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotkeys Setup — Hunt Design Lab</title>
    <link rel="icon" href="../../../assets/brand/favicon-32.png?v=4" type="image/png" sizes="32x32">
    <link rel="icon" href="../../../assets/brand/favicon.svg?v=4" type="image/svg+xml">
    <link rel="icon" href="../../../assets/brand/favicon.ico?v=4" sizes="any">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="../../../build/app.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #0d1117;
            font-family: Outfit, system-ui, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            color: #c9d1d9;
        }
        .popup-shell {
            max-width: 100%;
            padding: 0.75rem 1rem 1.5rem;
        }
        .popup-banner {
            font-size: 0.75rem;
            letter-spacing: 0.04em;
            opacity: 0.9;
            font-family: "JetBrains Mono", monospace;
        }
        .action-slot-card {
            border: 1px solid #30363d;
            background: #161b22;
            border-radius: 6px;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .action-slot-card:hover {
            border-color: #58a6ff;
        }
        .action-slot-card.active {
            border-color: #1f6feb;
            background: #1f242c;
            box-shadow: 0 0 0 1px #1f6feb;
        }
        .action-slot-card.drag-over {
            border-color: #238636;
            background: #13231a;
        }
        .hotkey-badge {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.75rem;
            background: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            font-weight: 700;
        }
        .catalog-item {
            border: 1px solid #21262d;
            background: #0e1116;
            border-radius: 4px;
            padding: 0.4rem 0.6rem;
            margin-bottom: 0.4rem;
            cursor: grab;
            transition: border-color 0.15s;
        }
        .catalog-item:hover {
            border-color: #388bfd;
            background: #161b22;
        }
        .catalog-item:active {
            cursor: grabbing;
        }
        .capture-active {
            animation: pulse-glow 1.2s infinite alternate;
            border-color: #e3b341 !important;
            color: #e3b341 !important;
        }
        @keyframes pulse-glow {
            from { box-shadow: 0 0 2px #e3b341; }
            to { box-shadow: 0 0 10px #e3b341; }
        }
        .nav-pills .nav-link {
            color: #8b949e;
            background: #161b22;
            border: 1px solid #30363d;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }
        .nav-pills .nav-link:hover {
            border-color: #58a6ff;
            color: #c9d1d9;
        }
        .nav-pills .nav-link.active {
            background-color: #1f6feb !important;
            border-color: #388bfd !important;
            color: #ffffff !important;
        }
        .border-dashed {
            border-style: dashed !important;
        }
        .hover-row:hover {
            background: rgba(88, 166, 255, 0.05);
        }
        .general-key-group button {
            transition: all 0.15s;
        }
        .general-key-group button:first-child:hover {
            background-color: #2a313c;
            color: #58a6ff !important;
            border-color: #58a6ff;
        }
    </style>
</head>
<body>
    <div class="popup-shell">
        <div class="popup-banner text-info d-flex justify-content-between align-items-center mb-3">
            <div>● HOTKEYS SETUP <span class="text-muted">— live link to hunt window</span></div>
            <div class="d-flex align-items-center gap-2" id="profileSelectWrapper">
                <span class="text-muted">Profile:</span>
                <select id="profileSelect" class="form-select form-select-sm bg-dark text-white border-secondary" style="width: auto; min-width: 140px;">
                    <option value="guardian">Guardian</option>
                    <option value="mystic">Mystic</option>
                    <option value="scout">Scout</option>
                    <option value="adept">Adept</option>
                    <option value="warden">Warden</option>
                    <option value="adventurer">Adventurer</option>
                </select>
            </div>
        </div>
        <div id="panelHost">
            <div class="p-4 text-muted small text-center">Loading interface…</div>
        </div>
    </div>

    <script>
        (async function boot() {
            const host = document.getElementById('panelHost');
            try {
                const res = await fetch('panel.html', { cache: 'no-cache' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                host.innerHTML = await res.text();
            } catch (err) {
                host.innerHTML = '<div class="p-3 text-danger small">Failed to load panel.html: '
                    + String(err.message || err) + '</div>';
                return;
            }
            const s = document.createElement('script');
            s.src = 'popup.js?v=4';
            document.body.appendChild(s);
        })();
    </script>
</body>
</html>
