<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select spell shape — Designer</title>
    <link rel="icon" href="../../../assets/brand/favicon-32.png?v=4" type="image/png" sizes="32x32">
    <link rel="icon" href="../../../assets/brand/favicon.svg?v=4" type="image/svg+xml">
    <link rel="icon" href="../../../assets/brand/favicon.ico?v=4" sizes="any">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #58a6ff;
            --hit: #3fb950;
            --origin: #f0883e;
            --selected: rgba(56, 139, 253, 0.18);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Outfit, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .sp-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }
        .sp-header h1 {
            margin: 0;
            font-family: Orbitron, sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            flex: 1 1 auto;
        }
        .sp-header .form-control,
        .sp-header .form-select {
            max-width: 180px;
            background: var(--bg);
            border-color: var(--border);
            color: var(--text);
            font-size: 0.85rem;
        }
        .sp-main {
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(260px, 1fr) minmax(220px, 0.9fr);
            gap: 0;
        }
        @media (max-width: 720px) {
            .sp-main { grid-template-columns: 1fr; }
        }
        .sp-list-col {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .sp-list {
            flex: 1 1 auto;
            overflow: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: calc( 100vh - 100px );
        }
        .sp-item {
            text-align: left;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--panel);
            color: var(--text);
            cursor: pointer;
            font-size: 0.82rem;
        }
        .sp-item:hover { border-color: var(--accent); }
        .sp-item.is-selected {
            border-color: var(--accent);
            background: var(--selected);
        }
        .sp-item-meta {
            display: block;
            margin-top: 2px;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.68rem;
            color: var(--muted);
        }
        .sp-preview-col {
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
            overflow: auto;
        }
        .sp-preview-title {
            font-size: 0.8rem;
            color: var(--muted);
            margin: 0;
        }
        .sp-preview-wrap {
            flex: 0 0 auto;
            display: inline-grid;
            gap: 2px;
            padding: 10px;
            background: #0a0e14;
            border: 1px solid var(--border);
            border-radius: 6px;
            align-self: start;
        }
        .sp-cell {
            width: 14px;
            height: 14px;
            border-radius: 2px;
            background: transparent;
        }
        .sp-cell.is-hit { background: var(--hit); opacity: 0.85; }
        .sp-cell.is-origin {
            background: var(--origin);
            box-shadow: 0 0 0 1px #fff3;
        }
        .sp-cell.is-empty {
            background: #21262d;
            opacity: 0.35;
        }
        .sp-shape-json {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.72rem;
            color: var(--accent);
            white-space: pre-wrap;
            margin: 0;
        }
        .sp-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 14px;
            background: var(--panel);
            border-top: 1px solid var(--border);
        }
        .sp-legend {
            font-size: 0.72rem;
            color: var(--muted);
        }
        .sp-legend span {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 4px;
            vertical-align: middle;
        }
        .sp-legend .hit { background: var(--hit); }
        .sp-legend .origin { background: var(--origin); }
        .sp-empty {
            padding: 1.5rem;
            color: var(--muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <header class="sp-header">
        <h1><i class="fa-solid fa-draw-polygon"></i> Select spell shape</h1>
        <select class="form-select form-select-sm" id="spTypeFilter" title="Type filter">
            <option value="">All types</option>
            <option value="area">area</option>
            <option value="wave">wave</option>
        </select>
        <input type="search" class="form-control form-control-sm" id="spFilter" placeholder="Filter…" autocomplete="off">
    </header>
    <div class="sp-main">
        <div class="sp-list-col">
            <div class="sp-list" id="spList" role="listbox" aria-label="Shape options"></div>
        </div>
        <div class="sp-preview-col">
            <p class="sp-preview-title" id="spPreviewLabel">Select a shape to preview</p>
            <div class="sp-preview-wrap" id="spPreview" hidden></div>
            <pre class="sp-shape-json" id="spJson"></pre>
            <p class="sp-legend mb-0">
                <span class="origin"></span> origin (3)
                &nbsp;·&nbsp;
                <span class="hit"></span> hit (1)
            </p>
        </div>
    </div>
    <footer class="sp-footer">
        <span class="text-muted small" id="spSelection">Nothing selected</span>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="spCancel">Cancel</button>
            <button type="button" class="btn btn-sm btn-primary" id="spSelect" disabled>
                <i class="fa-solid fa-check"></i> Select
            </button>
        </div>
    </footer>
    <script src="shape_picker.js"></script>
</body>
</html>
