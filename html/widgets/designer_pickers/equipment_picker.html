<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment — Hunt Design Lab</title>
    <link rel="icon" href="../../../assets/brand/favicon-32.png?v=4" type="image/png" sizes="32x32">
    <link rel="icon" href="../../../assets/brand/favicon.svg?v=4" type="image/svg+xml">
    <link rel="icon" href="../../../assets/brand/favicon.ico?v=4" sizes="any">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #58a6ff;
            --selected: rgba(56, 139, 253, 0.18);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Outfit, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .eq-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 10px;
            padding: 10px 14px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }
        .eq-header-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            min-width: 10rem;
        }
        .eq-header h1 {
            margin: 0;
            font-family: Orbitron, sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--text);
        }
        .eq-actions-dropdown .dropdown-menu {
            background: var(--panel);
            border-color: var(--border);
        }
        .eq-actions-dropdown .dropdown-item {
            color: var(--text);
            font-size: 0.85rem;
        }
        .eq-actions-dropdown .dropdown-item:hover,
        .eq-actions-dropdown .dropdown-item:focus {
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent);
        }
        body.ui-mode-select .eq-actions-dropdown,
        body.ui-mode-select .de-batch-check-wrap {
            display: none !important;
        }
        .de-batch-check-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }
        .de-batch-check-wrap .de-batch-check {
            margin: 0;
            cursor: pointer;
            width: 1rem;
            height: 1rem;
        }
        .eq-card {
            position: relative;
        }
        .eq-card .de-batch-check-wrap {
            position: absolute;
            top: 6px;
            left: 6px;
        }
        .eq-table-check {
            width: 2rem;
            text-align: center;
        }
        .eq-header .form-control,
        .eq-header .form-select {
            max-width: 160px;
            background: var(--bg);
            border-color: var(--border);
            color: var(--text);
            font-size: 0.85rem;
        }
        .eq-header .eq-level {
            max-width: 85px;
        }
        .eq-header .eq-filter-text {
            max-width: 190px;
            flex: 1 1 140px;
        }
        .eq-layout-toggle .btn {
            min-width: 2.1rem;
            padding: 0.25rem 0.45rem;
        }
        .eq-layout-toggle .btn.is-active {
            background: rgba(88, 166, 255, 0.2);
            border-color: var(--accent);
            color: var(--accent);
        }
        .eq-meta {
            font-size: 0.78rem;
            color: var(--muted);
            font-family: "JetBrains Mono", monospace;
            white-space: nowrap;
        }
        .eq-body {
            flex: 1 1 auto;
            display: flex;
            overflow: hidden;
            height: calc(100vh - 118px);
        }
        .eq-main-content {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 12px;
            min-width: 0;
        }
        .eq-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
            gap: 8px;
        }
        .eq-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--panel);
            cursor: pointer;
            text-align: center;
            transition: border-color 0.12s, background 0.12s;
        }
        .eq-card:hover { border-color: var(--accent); }
        .eq-card.is-selected {
            border-color: var(--accent);
            background: var(--selected);
            box-shadow: inset 0 0 0 1px rgba(88, 166, 255, 0.4);
        }
        .eq-thumb {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0e14;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .eq-thumb img {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }
        .eq-thumb .missing {
            font-size: 0.65rem;
            color: var(--muted);
        }
        .eq-name {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text);
            line-height: 1.25;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .eq-id {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.62rem;
            color: var(--muted);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .eq-stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 3px;
            margin-top: 4px;
            width: 100%;
        }
        .eq-badge {
            font-size: 0.65rem;
            padding: 1px 4px;
            border-radius: 3px;
            font-family: "JetBrains Mono", monospace;
            font-weight: 600;
            line-height: 1.3;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
        }
        .eq-badge-lvl { color: #f0883e; border-color: rgba(240, 136, 62, 0.35); background: rgba(240, 136, 62, 0.12); }
        .eq-badge-atk { color: #ff7b72; border-color: rgba(255, 123, 114, 0.35); background: rgba(255, 123, 114, 0.12); }
        .eq-badge-arm { color: #7ee787; border-color: rgba(126, 231, 135, 0.35); background: rgba(126, 231, 135, 0.12); }
        .eq-badge-def { color: #79c0ff; border-color: rgba(121, 192, 255, 0.35); background: rgba(121, 192, 255, 0.12); }
        .eq-badge-slot { color: #a5d6ff; border-color: rgba(165, 214, 255, 0.25); background: rgba(165, 214, 255, 0.08); }
        .eq-badge-cat { color: #d2a8ff; border-color: rgba(210, 168, 255, 0.3); background: rgba(210, 168, 255, 0.1); }

        .eq-table-wrap {
            width: 100%;
        }
        .eq-table-wrap table.dataTable {
            width: 100% !important;
            color: var(--text);
            border-color: var(--border);
            font-size: 0.82rem;
        }
        .eq-table-wrap table.dataTable thead th {
            background: var(--panel);
            border-bottom-color: var(--border) !important;
            color: var(--muted);
            font-family: Orbitron, Outfit, sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .eq-table-wrap table.dataTable tbody td {
            border-color: var(--border) !important;
            vertical-align: middle;
        }
        .eq-table-wrap table.dataTable tbody tr {
            cursor: pointer;
            background: transparent;
        }
        .eq-table-wrap table.dataTable tbody tr:hover {
            background: rgba(88, 166, 255, 0.08) !important;
        }
        .eq-table-wrap table.dataTable tbody tr.is-selected {
            background: var(--selected) !important;
            box-shadow: inset 3px 0 0 var(--accent);
        }
        .eq-table-wrap table.dataTable.table-striped > tbody > tr:nth-of-type(odd) > * {
            --bs-table-bg-type: rgba(255, 255, 255, 0.02);
        }
        .eq-table-wrap .dt-container .dt-search input,
        .eq-table-wrap .dt-container .dt-length select {
            background: var(--bg);
            border-color: var(--border);
            color: var(--text);
            font-size: 0.85rem;
        }
        .eq-table-wrap .dt-container .dt-info,
        .eq-table-wrap .dt-container .dt-paging .page-link {
            color: var(--muted);
            font-size: 0.8rem;
        }
        .eq-table-wrap .dt-container .page-item.active .page-link {
            background: var(--accent);
            border-color: var(--accent);
            color: #0d1117;
        }
        .eq-table-thumb {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #0a0e14;
            border-radius: 4px;
            border: 1px solid var(--border);
            overflow: hidden;
            vertical-align: middle;
        }
        .eq-table-thumb img {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }
        .eq-table-thumb .missing {
            font-size: 0.55rem;
            color: var(--muted);
        }
        .eq-table-name {
            font-weight: 500;
            color: var(--text);
        }
        .eq-table-id {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.72rem;
            color: var(--muted);
        }
        .eq-num {
            font-family: "JetBrains Mono", monospace;
            font-variant-numeric: tabular-nums;
        }

        /* Sidebar stats column for equipment details */
        .eq-sidebar {
            width: 310px;
            min-width: 310px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: -4px 0 16px rgba(0, 0, 0, 0.25);
        }
        .eq-sidebar-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
            text-align: center;
            padding: 20px 10px;
            gap: 12px;
        }
        .eq-sidebar-empty .eq-empty-icon {
            font-size: 2.5rem;
            color: var(--border);
        }
        .eq-sidebar-empty .eq-empty-text {
            font-size: 0.82rem;
            line-height: 1.45;
        }

        .eq-sidebar-content {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .eq-detail-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            gap: 8px;
        }
        .eq-detail-thumb {
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #06090e;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 16px rgba(88, 166, 255, 0.15);
        }
        .eq-detail-thumb img {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }
        .eq-detail-title {
            font-family: Orbitron, Outfit, sans-serif;
            font-size: 1.02rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            line-height: 1.25;
            letter-spacing: 0.02em;
        }
        .eq-detail-id {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.72rem;
            color: var(--accent);
            background: rgba(88, 166, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(88, 166, 255, 0.25);
            word-break: break-all;
        }
        .eq-detail-section-title {
            font-family: Orbitron, sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .eq-detail-section-title i {
            font-size: 0.75rem;
            color: var(--accent);
        }
        .eq-stat-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .eq-stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 6px 10px;
            font-size: 0.8rem;
        }
        .eq-stat-label {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--text);
            font-weight: 500;
        }
        .eq-stat-label i {
            width: 14px;
            text-align: center;
            font-size: 0.85rem;
        }
        .eq-stat-val {
            font-family: "JetBrains Mono", monospace;
            font-weight: 700;
            font-size: 0.82rem;
        }
        .eq-val-lvl { color: #f0883e; }
        .eq-val-atk { color: #ff7b72; }
        .eq-val-extra-atk { color: #ffa657; }
        .eq-val-arm { color: #7ee787; }
        .eq-val-def { color: #79c0ff; }
        .eq-val-speed { color: #d2a8ff; }
        .eq-val-wgt { color: #e6edf3; }
        .eq-val-slot { color: #a5d6ff; }
        .eq-val-cat { color: #7ee787; }

        .eq-pills-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .eq-pill {
            font-size: 0.7rem;
            font-family: "JetBrains Mono", monospace;
            padding: 2px 7px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .eq-pill-bonus {
            background: rgba(126, 231, 135, 0.12);
            border-color: rgba(126, 231, 135, 0.35);
            color: #7ee787;
        }
        .eq-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 14px;
            background: var(--panel);
            border-top: 1px solid var(--border);
        }
        /* view mode (Wiki embed): no select chrome; fill host frame */
        body.ui-mode-view .eq-footer-actions { display: none; }
        body.ui-mode-view .eq-body {
            height: calc(100vh - 70px);
        }
        body.ui-mode-view .eq-footer {
            justify-content: flex-start;
        }
        body.layout-table.ui-mode-view .eq-body,
        body.layout-table.ui-mode-select .eq-body {
            height: calc(100vh - 118px);
        }
        body.layout-table.ui-mode-view .eq-body {
            height: calc(100vh - 70px);
        }
        .eq-empty {
            padding: 2rem;
            text-align: center;
            color: var(--muted);
        }
        body.layout-grid #eqTableWrap { display: none !important; }
        body.layout-table #eqGrid { display: none !important; }
        /* Table mode: empty state is DataTables zeroRecords; keep #eqEmpty for load errors. */
        body.layout-table #eqEmpty:not(.is-error) { display: none !important; }
    </style>
</head>
<body class="ui-mode-select layout-grid">
    <header class="eq-header">
        <div class="eq-header-title-row">
            <h1><i class="fa-solid fa-shield-halved"></i> <span id="eqTitle">Select equipment</span></h1>
            <div class="dropdown eq-actions-dropdown">
                <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="eqActionsBtn"
                    data-bs-toggle="dropdown" aria-expanded="false" title="Batch actions">
                    Actions
                </button>
                <ul class="dropdown-menu" aria-labelledby="eqActionsBtn">
                    <li>
                        <button type="button" class="dropdown-item" id="deActionSmartSprites">
                            <i class="fa-solid fa-wand-magic-sparkles me-1"></i> Smart Update Sprites
                        </button>
                    </li>
                </ul>
            </div>
        </div>
        <input type="search" class="form-control form-control-sm eq-filter-text" id="eqFilter" placeholder="Filter name / id…" autocomplete="off">
        <select class="form-select form-select-sm" id="eqSlot" title="Slot filter">
            <option value="">All slots</option>
            <option value="helmet">Head / Helmet</option>
            <option value="armor">Chest / Armor</option>
            <option value="legs">Legs</option>
            <option value="boots">Boots</option>
            <option value="rightHand">Weapon (Right Hand)</option>
            <option value="leftHand">Shield (Left Hand)</option>
            <option value="amulet">Amulet</option>
            <option value="ring">Ring</option>
            <option value="backpack">Backpack</option>
            <option value="ammunition">Ammunition</option>
        </select>
        <select class="form-select form-select-sm" id="eqCategory" title="Category filter">
            <option value="">All categories</option>
        </select>
        <select class="form-select form-select-sm" id="eqWeaponType" title="Weapon type filter">
            <option value="">All weapon types</option>
            <option value="melee">Melee</option>
            <option value="distance">Distance</option>
            <option value="magic">Magic</option>
            <option value="shield">Shield</option>
        </select>
        <select class="form-select form-select-sm" id="eqVocation" title="Vocation filter">
            <option value="">All vocations</option>
        </select>
        <input type="number" class="form-control form-control-sm eq-level" id="eqMinLevel" placeholder="Min lvl" min="1" max="999" title="Minimum level" inputmode="numeric">
        <input type="number" class="form-control form-control-sm eq-level" id="eqMaxLevel" placeholder="Max lvl" min="1" max="999" title="Maximum level" inputmode="numeric">
        <select class="form-select form-select-sm" id="eqSort" title="Sort order (card layout)">
            <option value="level_asc">Level: Low → High</option>
            <option value="level_desc">Level: High → Low</option>
            <option value="name_asc">Name: A → Z</option>
            <option value="stat_desc">Highest Stat</option>
            <option value="category_asc">Category: A → Z</option>
            <option value="slot_asc">Slot: A → Z</option>
        </select>
        <div class="btn-group eq-layout-toggle" role="group" aria-label="Layout">
            <button type="button" class="btn btn-sm btn-outline-secondary is-active" id="eqLayoutGrid" title="Card grid layout">
                <i class="fa-solid fa-grip"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="eqLayoutTable" title="Table layout">
                <i class="fa-solid fa-table"></i>
            </button>
        </div>
        <span class="eq-meta" id="eqMeta">—</span>
    </header>
    <main class="eq-body">
        <div class="eq-main-content">
            <div class="eq-grid" id="eqGrid"></div>
            <div class="eq-table-wrap" id="eqTableWrap" hidden>
                <table class="table table-sm table-striped table-hover align-middle" id="eqTable" style="width:100%">
                    <thead>
                        <tr>
                            <th class="eq-table-check" data-priority="0" title="Batch select"></th>
                            <th data-priority="1"></th>
                            <th>Name</th>
                            <th>Id</th>
                            <th>Slot</th>
                            <th>Category</th>
                            <th>Type</th>
                            <th>Lvl</th>
                            <th>Atk</th>
                            <th>Arm</th>
                            <th>Def</th>
                        </tr>
                    </thead>
                    <tbody id="eqTableBody"></tbody>
                </table>
            </div>
            <div class="eq-empty" id="eqEmpty" hidden>No equipment items match this filter.</div>
        </div>
        <aside class="eq-sidebar" id="eqSidebar">
            <div class="eq-sidebar-empty" id="eqSidebarEmpty">
                <div class="eq-empty-icon"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="eq-empty-text">Select an equipment item to view details &amp; stats</div>
            </div>
            <div class="eq-sidebar-content" id="eqSidebarContent" hidden></div>
        </aside>
    </main>
    <footer class="eq-footer">
        <span class="eq-meta" id="eqSelection">Nothing selected</span>
        <div class="d-flex gap-2 eq-footer-actions">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="eqCancel">Cancel</button>
            <button type="button" class="btn btn-sm btn-primary" id="eqSelect" disabled>
                <i class="fa-solid fa-check"></i> Select
            </button>
        </div>
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="smart_update.js"></script>
    <script src="equipment_picker.js"></script>
</body>
</html>
