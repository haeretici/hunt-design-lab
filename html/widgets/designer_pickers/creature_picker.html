<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creatures — Hunt Design Lab</title>
    <link rel="icon" href="../../../assets/brand/favicon-32.png?v=4" type="image/png" sizes="32x32">
    <link rel="icon" href="../../../assets/brand/favicon.svg?v=4" type="image/svg+xml">
    <link rel="icon" href="../../../assets/brand/favicon.ico?v=4" sizes="any">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #58a6ff;
            --selected: rgba(56, 139, 253, 0.18);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Outfit, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .cr-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 10px;
            padding: 10px 14px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }
        .cr-header-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            min-width: 10rem;
        }
        .cr-header h1 {
            margin: 0;
            font-family: Orbitron, sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--text);
        }
        .cr-actions-dropdown .dropdown-menu {
            background: var(--panel);
            border-color: var(--border);
        }
        .cr-actions-dropdown .dropdown-item {
            color: var(--text);
            font-size: 0.85rem;
        }
        .cr-actions-dropdown .dropdown-item:hover,
        .cr-actions-dropdown .dropdown-item:focus {
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent);
        }
        /* Batch checkboxes + Actions: view mode only */
        body.ui-mode-select .cr-actions-dropdown,
        body.ui-mode-select .de-batch-check-wrap {
            display: none !important;
        }
        .de-batch-check-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }
        .de-batch-check-wrap .de-batch-check {
            margin: 0;
            cursor: pointer;
            width: 1rem;
            height: 1rem;
        }
        .cr-card {
            position: relative;
        }
        .cr-card .de-batch-check-wrap {
            position: absolute;
            top: 6px;
            left: 6px;
        }
        .cr-table-check {
            width: 2rem;
            text-align: center;
        }
        .cr-header .form-control,
        .cr-header .form-select {
            max-width: 170px;
            background: var(--bg);
            border-color: var(--border);
            color: var(--text);
            font-size: 0.85rem;
        }
        .cr-header .cr-level {
            max-width: 88px;
        }
        .cr-header .cr-filter-text {
            max-width: 200px;
            flex: 1 1 140px;
        }
        .cr-layout-toggle .btn {
            min-width: 2.1rem;
            padding: 0.25rem 0.45rem;
        }
        .cr-layout-toggle .btn.is-active {
            background: rgba(88, 166, 255, 0.2);
            border-color: var(--accent);
            color: var(--accent);
        }
        .cr-meta {
            font-size: 0.78rem;
            color: var(--muted);
            font-family: "JetBrains Mono", monospace;
            white-space: nowrap;
        }
        .cr-body {
            flex: 1 1 auto;
            display: flex;
            overflow: hidden;
            height: calc(100vh - 118px);
        }
        .cr-main-content {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 12px;
            min-width: 0;
        }
        .cr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
            gap: 8px;
        }
        .cr-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--panel);
            cursor: pointer;
            text-align: center;
            transition: border-color 0.12s, background 0.12s;
        }
        .cr-card:hover { border-color: var(--accent); }
        .cr-card.is-selected {
            border-color: var(--accent);
            background: var(--selected);
            box-shadow: inset 0 0 0 1px rgba(88, 166, 255, 0.4);
        }
        .cr-thumb {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0e14;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .cr-thumb img {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }
        .cr-thumb .missing {
            font-size: 0.65rem;
            color: var(--muted);
        }
        .cr-name {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text);
            line-height: 1.25;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .cr-id {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.62rem;
            color: var(--muted);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .cr-stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 3px;
            margin-top: 4px;
            width: 100%;
        }
        .cr-badge {
            font-size: 0.65rem;
            padding: 1px 4px;
            border-radius: 3px;
            font-family: "JetBrains Mono", monospace;
            font-weight: 600;
            line-height: 1.3;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
        }
        .cr-badge-lvl { color: #f0883e; border-color: rgba(240, 136, 62, 0.35); background: rgba(240, 136, 62, 0.12); }
        .cr-badge-hp { color: #ff7b72; border-color: rgba(255, 123, 114, 0.35); background: rgba(255, 123, 114, 0.12); }
        .cr-badge-exp { color: #d2a8ff; border-color: rgba(210, 168, 255, 0.35); background: rgba(210, 168, 255, 0.12); }
        .cr-badge-atk { color: #ffa657; border-color: rgba(255, 166, 87, 0.35); background: rgba(255, 166, 87, 0.12); }
        .cr-badge-threat { color: #ffa657; border-color: rgba(255, 166, 87, 0.35); background: rgba(255, 166, 87, 0.12); }
        .cr-badge-avghit { color: #ffdf5d; border-color: rgba(255, 223, 93, 0.35); background: rgba(255, 223, 93, 0.1); }
        .cr-badge-maxhit { color: #ff9bce; border-color: rgba(255, 155, 206, 0.35); background: rgba(255, 155, 206, 0.1); }
        .cr-badge-race { color: #7ee787; border-color: rgba(126, 231, 135, 0.35); background: rgba(126, 231, 135, 0.1); }
        .cr-badge-bestiary { color: #d2a8ff; border-color: rgba(210, 168, 255, 0.35); background: rgba(210, 168, 255, 0.1); }

        .cr-table-wrap {
            width: 100%;
        }
        .cr-table-wrap table.dataTable {
            width: 100% !important;
            color: var(--text);
            border-color: var(--border);
            font-size: 0.82rem;
        }
        .cr-table-wrap table.dataTable thead th {
            background: var(--panel);
            border-bottom-color: var(--border) !important;
            color: var(--muted);
            font-family: Orbitron, Outfit, sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .cr-table-wrap table.dataTable tbody td {
            border-color: var(--border) !important;
            vertical-align: middle;
        }
        .cr-table-wrap table.dataTable tbody tr {
            cursor: pointer;
            background: transparent;
        }
        .cr-table-wrap table.dataTable tbody tr:hover {
            background: rgba(88, 166, 255, 0.08) !important;
        }
        .cr-table-wrap table.dataTable tbody tr.is-selected {
            background: var(--selected) !important;
            box-shadow: inset 3px 0 0 var(--accent);
        }
        .cr-table-wrap table.dataTable.table-striped > tbody > tr:nth-of-type(odd) > * {
            --bs-table-bg-type: rgba(255, 255, 255, 0.02);
        }
        .cr-table-wrap .dt-container .dt-search input,
        .cr-table-wrap .dt-container .dt-length select {
            background: var(--bg);
            border-color: var(--border);
            color: var(--text);
            font-size: 0.85rem;
        }
        .cr-table-wrap .dt-container .dt-info,
        .cr-table-wrap .dt-container .dt-paging .page-link {
            color: var(--muted);
            font-size: 0.8rem;
        }
        .cr-table-wrap .dt-container .page-item.active .page-link {
            background: var(--accent);
            border-color: var(--accent);
            color: #0d1117;
        }
        .cr-table-thumb {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #0a0e14;
            border-radius: 4px;
            border: 1px solid var(--border);
            overflow: hidden;
            vertical-align: middle;
        }
        .cr-table-thumb img {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }
        .cr-table-thumb .missing {
            font-size: 0.55rem;
            color: var(--muted);
        }
        .cr-table-name {
            font-weight: 500;
            color: var(--text);
        }
        .cr-table-id {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.72rem;
            color: var(--muted);
        }
        .cr-num {
            font-family: "JetBrains Mono", monospace;
            font-variant-numeric: tabular-nums;
        }

        .cr-sidebar {
            width: 310px;
            min-width: 310px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: -4px 0 16px rgba(0, 0, 0, 0.25);
        }
        .cr-sidebar-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
            text-align: center;
            padding: 20px 10px;
            gap: 12px;
        }
        .cr-sidebar-empty .cr-empty-icon {
            font-size: 2.5rem;
            color: var(--border);
        }
        .cr-sidebar-empty .cr-empty-text {
            font-size: 0.82rem;
            line-height: 1.45;
        }
        .cr-sidebar-content {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .cr-detail-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            gap: 8px;
        }
        .cr-detail-thumb {
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #06090e;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 16px rgba(88, 166, 255, 0.15);
        }
        .cr-detail-thumb img {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }
        .cr-detail-title {
            font-family: Orbitron, Outfit, sans-serif;
            font-size: 1.02rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            line-height: 1.25;
            letter-spacing: 0.02em;
        }
        .cr-detail-id {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.72rem;
            color: var(--accent);
            background: rgba(88, 166, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(88, 166, 255, 0.25);
            word-break: break-all;
        }
        .cr-detail-section-title {
            font-family: Orbitron, sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cr-detail-section-title i {
            font-size: 0.75rem;
            color: var(--accent);
        }
        .cr-stat-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .cr-stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 6px 10px;
            font-size: 0.8rem;
        }
        .cr-stat-label {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--text);
            font-weight: 500;
        }
        .cr-stat-label i {
            width: 14px;
            text-align: center;
            font-size: 0.85rem;
        }
        .cr-stat-val {
            font-family: "JetBrains Mono", monospace;
            font-weight: 700;
            font-size: 0.82rem;
        }
        .cr-val-lvl { color: #f0883e; }
        .cr-val-hp { color: #ff7b72; }
        .cr-val-atk { color: #ffa657; }
        .cr-val-threat { color: #ffa657; }
        .cr-val-avghit { color: #ffdf5d; }
        .cr-val-maxhit { color: #ff9bce; }
        .cr-val-burst { color: #ffb86c; }
        .cr-val-arm { color: #7ee787; }
        .cr-val-spd { color: #d2a8ff; }
        .cr-val-exp { color: #a5d6ff; }
        .cr-val-race { color: #7ee787; }
        .cr-pills-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .cr-pill {
            font-size: 0.7rem;
            font-family: "JetBrains Mono", monospace;
            padding: 2px 7px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .cr-notes {
            font-size: 0.78rem;
            color: var(--muted);
            line-height: 1.4;
        }
        .cr-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 14px;
            background: var(--panel);
            border-top: 1px solid var(--border);
        }
        /* view mode (Wiki): picker confirm bar is select-only; fill host frame */
        body.ui-mode-view .cr-footer { display: none; }
        body.ui-mode-view .cr-body {
            height: calc(100vh - 70px);
        }
        body.layout-table.ui-mode-view .cr-body,
        body.layout-table.ui-mode-select .cr-body {
            height: calc(100vh - 118px);
        }
        body.layout-table.ui-mode-view .cr-body {
            height: calc(100vh - 70px);
        }
        .cr-empty {
            padding: 2rem;
            text-align: center;
            color: var(--muted);
        }
        body.layout-grid #crTableWrap { display: none !important; }
        body.layout-table #crGrid { display: none !important; }
        /* Table mode: empty state is DataTables zeroRecords; keep #crEmpty for load errors. */
        body.layout-table #crEmpty:not(.is-error) { display: none !important; }
    </style>
</head>
<body class="ui-mode-select layout-grid">
    <header class="cr-header">
        <div class="cr-header-title-row">
            <h1><i class="fa-solid fa-dragon"></i> <span id="crTitle">Select creature</span></h1>
            <div class="dropdown cr-actions-dropdown">
                <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="crActionsBtn"
                    data-bs-toggle="dropdown" aria-expanded="false" title="Batch actions">
                    Actions
                </button>
                <ul class="dropdown-menu" aria-labelledby="crActionsBtn">
                    <li>
                        <button type="button" class="dropdown-item" id="deActionSmartSprites">
                            <i class="fa-solid fa-wand-magic-sparkles me-1"></i> Smart Update Sprites
                        </button>
                    </li>
                </ul>
            </div>
        </div>
        <input type="search" class="form-control form-control-sm cr-filter-text" id="crFilter" placeholder="Filter name / id…" autocomplete="off">
        <select class="form-select form-select-sm" id="crRace" title="Filter by race">
            <option value="">All races</option>
        </select>
        <select class="form-select form-select-sm" id="crBestiaryClass" title="Filter by bestiary class">
            <option value="">All bestiary classes</option>
        </select>
        <input type="number" class="form-control form-control-sm cr-level" id="crLevelMin" placeholder="Lvl min" min="0" max="999" step="1" title="Minimum level" inputmode="numeric">
        <input type="number" class="form-control form-control-sm cr-level" id="crLevelMax" placeholder="Lvl max" min="0" max="999" step="1" title="Maximum level" inputmode="numeric">
        <select class="form-select form-select-sm" id="crSort" title="Sort order (card layout)">
            <option value="name_asc">Name: A → Z</option>
            <option value="name_desc">Name: Z → A</option>
            <option value="level_desc">Level: High → Low</option>
            <option value="level_asc">Level: Low → High</option>
            <option value="hp_desc">HP: High → Low</option>
            <option value="exp_desc">Exp: High → Low</option>
            <option value="race_asc">Race: A → Z</option>
            <option value="bestiary_asc">Bestiary class: A → Z</option>
        </select>
        <div class="btn-group cr-layout-toggle" role="group" aria-label="Layout">
            <button type="button" class="btn btn-sm btn-outline-secondary is-active" id="crLayoutGrid" title="Card grid layout">
                <i class="fa-solid fa-grip"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="crLayoutTable" title="Table layout">
                <i class="fa-solid fa-table"></i>
            </button>
        </div>
        <span class="cr-meta" id="crMeta">—</span>
    </header>
    <main class="cr-body">
        <div class="cr-main-content">
            <div class="cr-grid" id="crGrid"></div>
            <div class="cr-table-wrap" id="crTableWrap" hidden>
                <table class="table table-sm table-striped table-hover align-middle" id="crTable" style="width:100%">
                    <thead>
                        <tr>
                            <th class="cr-table-check" data-priority="0" title="Batch select"></th>
                            <th data-priority="1"></th>
                            <th>Name</th>
                            <th>Id</th>
                            <th>Race</th>
                            <th>Bestiary</th>
                            <th>Lvl</th>
                            <th>HP</th>
                            <th title="Sustained kit threat DPS (threatDps)">Threat</th>
                            <th title="Rate-weighted mean hit (avgHit)">Avg Hit</th>
                            <th title="Highest attack.max on kit (maxHit)">Max Hit</th>
                            <th>Exp</th>
                        </tr>
                    </thead>
                    <tbody id="crTableBody"></tbody>
                </table>
            </div>
            <div class="cr-empty" id="crEmpty" hidden>No creatures match this filter.</div>
        </div>
        <aside class="cr-sidebar" id="crSidebar">
            <div class="cr-sidebar-empty" id="crSidebarEmpty">
                <div class="cr-empty-icon"><i class="fa-solid fa-dragon"></i></div>
                <div class="cr-empty-text">Select a creature to view combat stats &amp; details</div>
            </div>
            <div class="cr-sidebar-content" id="crSidebarContent" hidden></div>
        </aside>
    </main>
    <footer class="cr-footer">
        <span class="cr-meta" id="crSelection">Nothing selected</span>
        <div class="d-flex gap-2 cr-footer-actions">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="crCancel">Cancel</button>
            <button type="button" class="btn btn-sm btn-primary" id="crSelect" disabled>
                <i class="fa-solid fa-check"></i> Select
            </button>
        </div>
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="smart_update.js"></script>
    <script src="creature_picker.js"></script>
</body>
</html>
