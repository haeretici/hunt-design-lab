<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select tile — Designer</title>
    <link rel="icon" href="../../../assets/brand/favicon-32.png?v=4" type="image/png" sizes="32x32">
    <link rel="icon" href="../../../assets/brand/favicon.svg?v=4" type="image/svg+xml">
    <link rel="icon" href="../../../assets/brand/favicon.ico?v=4" sizes="any">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #58a6ff;
            --selected: rgba(56, 139, 253, 0.18);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Outfit, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .tp-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }
        .tp-header h1 {
            margin: 0;
            font-family: Orbitron, sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            flex: 1 1 auto;
        }
        .tp-header .form-control,
        .tp-header .form-select {
            max-width: 220px;
            background: var(--bg);
            border-color: var(--border);
            color: var(--text);
            font-size: 0.85rem;
        }
        .tp-meta {
            font-size: 0.78rem;
            color: var(--muted);
            font-family: "JetBrains Mono", monospace;
        }
        .tp-body {
            flex: 1 1 auto;
            display: flex;
            overflow: hidden;
            height: calc(100vh - 105px);
        }
        .tp-main-content {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 12px;
        }
        .tp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
            gap: 8px;
        }
        .tp-grid.tp-grid-equipment {
            grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
        }

        /* Sidebar stats column for equipment details */
        .tp-sidebar {
            width: 300px;
            min-width: 300px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: -4px 0 16px rgba(0, 0, 0, 0.25);
        }
        .tp-sidebar-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
            text-align: center;
            padding: 20px 10px;
            gap: 12px;
        }
        .tp-sidebar-empty .tp-empty-icon {
            font-size: 2.5rem;
            color: var(--border);
        }
        .tp-sidebar-empty .tp-empty-text {
            font-size: 0.82rem;
            line-height: 1.45;
        }

        .tp-sidebar-content {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Sidebar Detail Cards */
        .tp-detail-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            gap: 8px;
        }
        .tp-detail-thumb {
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #06090e;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 16px rgba(88, 166, 255, 0.15);
        }
        .tp-detail-thumb img {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }
        .tp-detail-title {
            font-family: Orbitron, Outfit, sans-serif;
            font-size: 1.02rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            line-height: 1.25;
            letter-spacing: 0.02em;
        }
        .tp-detail-id {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.72rem;
            color: var(--accent);
            background: rgba(88, 166, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(88, 166, 255, 0.25);
            word-break: break-all;
        }

        .tp-detail-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .tp-detail-section-title {
            font-family: Orbitron, sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tp-detail-section-title i {
            font-size: 0.75rem;
            color: var(--accent);
        }

        .tp-stat-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .tp-stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 6px 10px;
            font-size: 0.8rem;
        }
        .tp-stat-label {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--text);
            font-weight: 500;
        }
        .tp-stat-label i {
            width: 14px;
            text-align: center;
            font-size: 0.85rem;
        }
        .tp-stat-val {
            font-family: "JetBrains Mono", monospace;
            font-weight: 700;
            font-size: 0.82rem;
        }

        /* Stat Value Colors */
        .tp-val-lvl { color: #f0883e; }
        .tp-val-atk { color: #ff7b72; }
        .tp-val-extra-atk { color: #ffa657; }
        .tp-val-arm { color: #7ee787; }
        .tp-val-def { color: #79c0ff; }
        .tp-val-speed { color: #d2a8ff; }
        .tp-val-wgt { color: #e6edf3; }
        .tp-val-slot { color: #a5d6ff; }
        .tp-val-cat { color: #7ee787; }

        .tp-pills-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .tp-pill {
            font-size: 0.7rem;
            font-family: "JetBrains Mono", monospace;
            padding: 2px 7px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .tp-pill-bonus {
            background: rgba(126, 231, 135, 0.12);
            border-color: rgba(126, 231, 135, 0.35);
            color: #7ee787;
        }
        .tp-pill-resist {
            background: rgba(121, 192, 255, 0.12);
            border-color: rgba(121, 192, 255, 0.35);
            color: #79c0ff;
        }

        .tp-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--panel);
            cursor: pointer;
            text-align: center;
            transition: border-color 0.12s, background 0.12s;
        }
        .tp-card:hover { border-color: var(--accent); }
        .tp-card.is-selected {
            border-color: var(--accent);
            background: var(--selected);
            box-shadow: inset 0 0 0 1px rgba(88, 166, 255, 0.4);
        }
        .tp-stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 3px;
            margin-top: 4px;
            width: 100%;
        }
        .tp-stat-badge {
            font-size: 0.65rem;
            padding: 1px 4px;
            border-radius: 3px;
            font-family: "JetBrains Mono", monospace;
            font-weight: 600;
            line-height: 1.3;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
        }
        .tp-stat-lvl { color: #f0883e; border-color: rgba(240, 136, 62, 0.35); background: rgba(240, 136, 62, 0.12); }
        .tp-stat-atk { color: #ff7b72; border-color: rgba(255, 123, 114, 0.35); background: rgba(255, 123, 114, 0.12); }
        .tp-stat-arm { color: #7ee787; border-color: rgba(126, 231, 135, 0.35); background: rgba(126, 231, 135, 0.12); }
        .tp-stat-def { color: #79c0ff; border-color: rgba(121, 192, 255, 0.35); background: rgba(121, 192, 255, 0.12); }
        .tp-stat-wgt { color: #d2a8ff; border-color: rgba(210, 168, 255, 0.35); background: rgba(210, 168, 255, 0.12); }
        .tp-stat-slot { color: #a5d6ff; border-color: rgba(165, 214, 255, 0.25); background: rgba(165, 214, 255, 0.08); }
        .tp-thumb {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0e14;
            border-radius: 4px;
            overflow: hidden;
        }
        .tp-thumb img {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }
        .tp-thumb .missing {
            font-size: 0.65rem;
            color: var(--muted);
        }
        .tp-name {
            font-size: 0.72rem;
            color: var(--text);
            line-height: 1.2;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tp-id {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.62rem;
            color: var(--muted);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tp-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 14px;
            background: var(--panel);
            border-top: 1px solid var(--border);
        }
        .tp-empty {
            padding: 2rem;
            text-align: center;
            color: var(--muted);
        }
        .btn-retro {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header class="tp-header">
        <h1><i class="fa-solid fa-border-all"></i> <span id="tpTitle">Select asset</span></h1>
        <input type="search" class="form-control form-control-sm" id="tpFilter" placeholder="Filter by name / id…" autocomplete="off">
        <select class="form-select form-select-sm" id="tpCategory" title="Category filter">
            <option value="">All categories</option>
        </select>
        <span class="tp-meta" id="tpMeta">—</span>
    </header>
    <main class="tp-body">
        <div class="tp-main-content">
            <div class="tp-grid" id="tpGrid"></div>
            <div class="tp-empty" id="tpEmpty" hidden>No items match this filter.</div>
        </div>
    </main>
    <footer class="tp-footer">
        <span class="tp-meta" id="tpSelection">Nothing selected</span>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="tpCancel">Cancel</button>
            <button type="button" class="btn btn-sm btn-primary" id="tpSelect" disabled>
                <i class="fa-solid fa-check"></i> Select
            </button>
        </div>
    </footer>
    <script src="tile_picker.js"></script>
</body>
</html>
